name: Test KP Live Traffic

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright beautifulsoup4 requests pandas tqdm openai
          playwright install --with-deps chromium

      - name: Ensure Output Directory Exists
        run: mkdir -p data/dynamic/

      - name: Run KP Live Traffic Scraper
        run: python collectors/kp_live_traffic.py

      - name: Run Pandal Facebook Scraper
        env:
          SCRAPEBADGER_API_KEY: ${{ secrets.SCRAPEBADGER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python collectors/scrape_pandal_facebook_updates_2026.py

      - name: Run TomTom Traffic Monitor
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python collectors/kolkata_traffic_monitor_updated.py --live

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live data [skip ci]" && git push)

      - name: Push to MCP Server Repository
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.TARGET_REPO_TOKEN }}
        with:
          source_file: 'data/dynamic/'
          destination_repo: 'AmanBasu20/kolkata-puja-mcp-server'
          destination_folder: 'data/dynamic/'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
          commit_message: 'Auto-sync updated Kolkata Puja dynamic data'
